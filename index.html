async function unlock(){

  if(!(window.crypto&&crypto.subtle)){msg.textContent="この環境では開けません（https のページで開いてください）";return}

  try{
    const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);

    document.open();document.write(html);document.close();
  }catch(e){msg.textContent="パスワードが違います"}
}
