  const msg=document.getElementById("msg"),pw=document.getElementById("pw").value;
  if(!pw){msg.textContent="パスワードを入れてください";return}
  if(!(window.crypto&&crypto.subtle)){msg.textContent="この環境では開けません（https のページで開いてください）";return}
  msg.textContent="確認しています…";
  try{
    const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.salt),iterations:D.it,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
    const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},key,b64(D.ct));
    const html=new TextDecoder().decode(buf);
    document.open();document.write(html);document.close();
  }catch(e){msg.textContent="パスワードが違います"}
}
document.getElementById("go").onclick=unlock;
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
</script></body></html>
